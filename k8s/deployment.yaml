apiVersion: apps/v1
kind: Deployment

metadata:
  name: smart-bookmark-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: smart-bookmark

  template:
    metadata:
      labels:
        app: smart-bookmark

    spec:
      containers:
        - name: smart-bookmark

          image: smart-bookmark-app:latest

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          envFrom:
            - secretRef:
                name: smart-bookmark-secret